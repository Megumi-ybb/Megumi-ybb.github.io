<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Page not found | Bo Yang</title>
    <style>
      .error-page { display: grid; min-height: 100vh; padding: 2rem; place-items: center; text-align: center; }
      .error-page main { max-width: 46rem; margin: 0; }
      .error-code { margin-bottom: 1rem; color: var(--gold); font-family: var(--serif); font-size: 1rem; }
      .error-page h1 { max-width: none; margin-bottom: 1.25rem; font-size: clamp(3rem, 8vw, 6rem); }
      .error-page p { margin-bottom: 2rem; color: var(--muted); font-size: 1.1rem; }
    </style>
  </head>
  <body class="error-page">
    <main>
      <p class="error-code">Error 404</p>
      <h1>Page not found</h1>
      <p>The requested page does not exist or may have moved.</p>
      <a class="button button-primary" href="./">Return home</a>
    </main>
  </body>
</html>
